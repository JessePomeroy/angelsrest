<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
		<!--
			Apply the saved light/dark mode before hydration
			Only toggles the 'dark' class for light/dark switching
		-->
		<script>
			(() => {
				let stored = null;
				try {
					stored = localStorage.getItem('theme');
				} catch {
					// Storage can be unavailable; first paint still follows the system.
				}
				const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches ?? true;
				const isDark = stored === 'dark' || (stored !== 'light' && prefersDark);
				
				if (isDark) {
					document.documentElement.classList.add('dark');
				} else {
					document.documentElement.classList.remove('dark');
				}
				
				// Time-aware theming: set period based on current hour
				const hour = new Date().getHours();
				let period = 'afternoon'; // default
				if (hour >= 5 && hour < 8) period = 'dawn';
				else if (hour >= 8 && hour < 12) period = 'morning';
				else if (hour >= 12 && hour < 17) period = 'afternoon';
				else if (hour >= 17 && hour < 20) period = 'golden';
				else if (hour >= 20 && hour < 22) period = 'evening';
				else period = 'night';
				document.documentElement.setAttribute('data-time-period', period);
			})();
		</script>
		<!-- Fonts: Chillax (display) + Synonym (body) from Fontshare -->
		<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=chillax@400,600&f[]=synonym@400,500&display=swap" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
