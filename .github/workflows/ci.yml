name: CI

on:
  workflow_dispatch:
    inputs:
      release_environment:
        description: Logical environment for this immutable CI record (not a deployment)
        type: choice
        required: true
        default: production
        options:
          - production
          - staging
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Audit H43: cancel in-progress runs for the same ref when a newer push arrives.
concurrency:
  group: ci-${{ github.ref }}-${{ inputs.release_environment || 'production' }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: read

jobs:
  ci:
    runs-on: ubuntu-latest
    # Job-level env: every step inherits these placeholders. Both the
    # type-check and the test suite reference `$env/static/public.*` /
    # `process.env.*` at module-load time; without these set, modules
    # like adminAuth.ts (which reads PUBLIC_CONVEX_URL) throw
    # "Auth backend not configured" before any test mocks can intercept.
    # Locally these values come from `.env.local`; CI gets the same shape
    # via this block so tests + type-check run against identical inputs.
    env:
      STRIPE_SECRET_KEY: placeholder
      STRIPE_WEBHOOK_SECRET: placeholder
      STRIPE_PLATFORM_WEBHOOK_SECRET: placeholder
      RESEND_API_KEY: placeholder
      PUBLIC_SITE_URL: https://www.angelsrest.online
      PUBLIC_STRIPE_PUBLIC_KEY: placeholder
      # Public, non-secret production read endpoints. Browser E2E exercises the
      # same Convex-only published-content boundary as the deployed site.
      PUBLIC_CONVEX_URL: https://loyal-swan-967.convex.cloud
      PUBLIC_CONVEX_SITE_URL: https://loyal-swan-967.convex.site
      GALLERY_WORKER_URL: placeholder
      GALLERY_ADMIN_SECRET: placeholder
      CHECKOUT_SNAPSHOT_MODE: handle-v2
      NEW_ORDER_CHECKOUT_CONTROL: '{"version":1,"tenants":[{"siteUrl":"angelsrest.online","state":"open","generation":1},{"siteUrl":"zippymiggy.com","state":"open","generation":1}]}'
      RELEASE_WORKER_REVISION: fd82eb9f89d251d1348319dcd2a456771d210bce
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24.18.0
          package-manager-cache: false
          registry-url: "https://npm.pkg.github.com"
          scope: "@jessepomeroy"
          token: ""

      - name: Enable reviewed pnpm
        run: |
          corepack enable
          corepack pnpm --version | grep -Fx '10.34.5'

      # Use the real, reviewed peer implementation; never copy its response shapes.
      - name: Check out pinned gallery and artwork Worker contracts
        id: worker_checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: JessePomeroy/gallery-worker
          ref: ${{ env.RELEASE_WORKER_REVISION }}
          path: .contract/gallery-worker
          token: ${{ secrets.GH_PACKAGES_TOKEN }}
          persist-credentials: false

      - name: Install dependencies
        id: dependency_install
        run: corepack pnpm install --frozen-lockfile --ignore-scripts
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GH_PACKAGES_TOKEN }}

      - name: Install Worker contract dependencies
        id: worker_install
        run: npm ci --prefix .contract/gallery-worker --ignore-scripts

      - name: Require a changeset for CRM API surface changes
        if: github.event_name == 'pull_request'
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: |
          changed=$(git diff --name-only origin/main...HEAD)
          base_version=$(git show origin/main:packages/crm-api/package.json | node -e "let s=''; process.stdin.on('data', c => s += c).on('end', () => process.stdout.write(JSON.parse(s).version))")
          head_version=$(node -p "require('./packages/crm-api/package.json').version")
          release_pr=false
          if [ "$GITHUB_HEAD_REF" = 'changeset-release/main' ] && [ "$PR_AUTHOR" = 'github-actions[bot]' ]; then release_pr=true; fi
          if [ "$base_version" != "$head_version" ] && [ "$release_pr" != true ]; then
            echo 'Direct CRM API version changes are reserved for the Changesets release PR.'
            exit 1
          fi
          public=$(grep -E '^packages/crm-api/(src/|convex/.*\.ts$)' <<<"$changed" | grep -Ev '(\.test\.ts$|/__tests__/|/_generated/ai/)' || true)
          if { [ -n "$public" ] || grep -Fxq 'packages/crm-api/package.json' <<<"$changed"; } && [ "$release_pr" != true ]; then
            added=$(git diff --diff-filter=A --name-only origin/main...HEAD -- '.changeset/*.md' | grep -v '/README.md$' || true)
            test -n "$added" || { echo 'CRM API surface changes require a new .changeset/*.md file.'; exit 1; }
            corepack pnpm changeset status --since=origin/main --output=/tmp/changeset-status.json
            node -e "const s=require('/tmp/changeset-status.json'); if (!s.releases.some(r => r.name === '@jessepomeroy/crm-api')) process.exit(1)"
          fi

      # Audit H50: match the local `pnpm lint` command (biome check .) so CI
      # and local linting agree on scope. Previously CI scanned only src/,
      # which meant scripts/ and convex/ lint errors slipped through.
      - name: Lint
        id: lint
        run: pnpm lint

      - name: Type check
        id: typecheck
        run: |
          pnpm check
          pnpm check:package-contract
          pnpm --filter @jessepomeroy/crm-api exec tsc -p tsconfig.json --noEmit
          pnpm --filter @jessepomeroy/gallery-delivery check
          pnpm --filter @jessepomeroy/print-catalog check

      # Audit H41: run the full vitest suite on every PR / push so regressions
      # land in the status check, not in production.
      - name: Tests
        id: tests
        run: |
          pnpm test:print-contract
          pnpm test:gallery-upload-contract
          pnpm test
          pnpm --filter @jessepomeroy/gallery-delivery test
          pnpm --filter @jessepomeroy/print-catalog test

      - name: Retired platform checkout handler stays absent
        id: retired_checkout
        run: test ! -f src/routes/api/platform/create-checkout/+server.ts

      - name: Build and enforce size budgets
        id: build
        shell: bash
        run: |
          pnpm build
          pnpm check:build-budget | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Component browser regressions
        id: component_browser
        run: pnpm test:browser

      - name: Browser and public server E2E
        id: e2e
        run: pnpm test:e2e

      - name: Record the tested build
        id: release_record
        env:
          RELEASE_SITE_URL: angelsrest.online
          RELEASE_ENVIRONMENT: ${{ github.event_name == 'workflow_dispatch' && inputs.release_environment || 'production' }}
          RELEASE_WORKFLOW_PATH: .github/workflows/ci.yml
          RELEASE_HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          RELEASE_CHECKS_JSON: >-
            {"dependency_install":"${{ steps.dependency_install.outcome }}",
            "worker_checkout":"${{ steps.worker_checkout.outcome }}",
            "worker_install":"${{ steps.worker_install.outcome }}",
            "lint":"${{ steps.lint.outcome }}",
            "typecheck":"${{ steps.typecheck.outcome }}",
            "tests":"${{ steps.tests.outcome }}",
            "retired_checkout":"${{ steps.retired_checkout.outcome }}",
            "build":"${{ steps.build.outcome }}",
            "component_browser":"${{ steps.component_browser.outcome }}",
            "e2e":"${{ steps.e2e.outcome }}"}
        run: node scripts/release-record.mjs build

      - name: Preserve the immutable release record
        id: release_artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-record-${{ github.repository_id }}-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .output/release-record/build.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: false
          retention-days: 30

      - name: Link the release artifact receipt
        env:
          ARTIFACT_ID: ${{ steps.release_artifact.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.release_artifact.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.release_artifact.outputs.artifact-digest }}
        run: |
          printf 'Release record artifact: [%s](%s)\n\nArchive SHA-256: `%s`\n\nThis CI fixture build is not a deployment or capability observation.\n' "$ARTIFACT_ID" "$ARTIFACT_URL" "$ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"

      - name: Preserve failed browser diagnostics
        if: failure() && (steps.component_browser.outcome == 'failure' || steps.e2e.outcome == 'failure')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failure
          path: test-results/
          retention-days: 7
